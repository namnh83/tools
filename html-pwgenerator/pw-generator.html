<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            padding: 40px;
            width: 100%;
            max-width: 560px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e3c72;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #2a5298;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .checkboxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f7fa;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .checkbox-item:hover {
            background: #e8eef7;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button.main-btn {
            width: 100%;
            padding: 14px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button.main-btn:hover {
            background: #1e3c72;
        }

        .result {
            margin-top: 30px;
            display: none;
        }

        .password-list {
            max-height: 340px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafbfc;
        }

        .password-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
        }

        .password-item:last-child {
            border-bottom: none;
        }

        .password-item:hover {
            background: #f0f4f8;
        }

        .password-text {
            flex: 1;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1.05rem;
            word-break: break-all;
            user-select: all;
        }

        .copy-one {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .copy-one:hover {
            background: #218838;
        }

        .copy-all {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
        }

        .copy-all:hover {
            background: #218838;
        }

        .copied {
            text-align: center;
            color: #28a745;
            font-weight: 600;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copied.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>

        <div class="row">
            <div class="form-group">
                <label for="length">Password length</label>
                <input type="number" id="length" min="4" max="128" value="16">
            </div>

            <div class="form-group">
                <label for="count">How many passwords?</label>
                <input type="number" id="count" min="1" max="100" value="5">
            </div>
        </div>

        <div class="form-group">
            <label>Character types</label>
            <div class="checkboxes">
                <label class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked>
                    Lowercase (a-z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked>
                    Uppercase (A-Z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="numbers" checked>
                    Numbers (0-9)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="symbols" checked>
                    Symbols (!@#...)
                </label>
            </div>
        </div>

        <button class="main-btn" onclick="generatePasswords()">Generate Passwords</button>

        <div class="result" id="result">
            <div class="password-list" id="passwordList"></div>
            <button class="copy-all" onclick="copyAll()">Copy All Passwords</button>
            <div class="copied" id="copied">Copied!</div>
        </div>
    </div>

    <script>
        let generatedPasswords = [];

        function generatePasswords() {
            const length = parseInt(document.getElementById('length').value);
            const count = parseInt(document.getElementById('count').value);

            if (isNaN(length) || length < 4) {
                alert("Please enter a password length of at least 4");
                return;
            }

            if (isNaN(count) || count < 1 || count > 100) {
                alert("Please enter a number between 1 and 100");
                return;
            }

            let charset = "";
            if (document.getElementById('lowercase').checked) charset += "abcdefghijklmnopqrstuvwxyz";
            if (document.getElementById('uppercase').checked) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (document.getElementById('numbers').checked)   charset += "0123456789";
            if (document.getElementById('symbols').checked)   charset += "!@#$%^&*()_+-=[]{}|;:,.<>?";

            if (charset === "") {
                alert("Please select at least one character type");
                return;
            }

            const list = document.getElementById('passwordList');
            list.innerHTML = "";
            generatedPasswords = [];

            for (let i = 0; i < count; i++) {
                const password = createPassword(length, charset);
                generatedPasswords.push(password);

                const item = document.createElement('div');
                item.className = 'password-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'password-text';
                textSpan.textContent = password;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-one';
                copyBtn.textContent = 'Copy';
                copyBtn.onclick = () => copyOne(password);

                item.appendChild(textSpan);
                item.appendChild(copyBtn);
                list.appendChild(item);
            }

            document.getElementById('result').style.display = 'block';
            document.getElementById('copied').classList.remove('show');
        }

        function createPassword(length, charset) {
            let password = "";
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);

            for (let i = 0; i < length; i++) {
                password += charset[array[i] % charset.length];
            }
            return password;
        }

        function copyOne(password) {
            navigator.clipboard.writeText(password).then(showCopied);
        }

        function copyAll() {
            if (generatedPasswords.length === 0) return;
            navigator.clipboard.writeText(generatedPasswords.join('\n')).then(showCopied);
        }

        function showCopied() {
            const msg = document.getElementById('copied');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }

        // Generate on page load
        generatePasswords();
    </script>
</body>
</html>
